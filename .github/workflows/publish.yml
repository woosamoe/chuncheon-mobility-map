name: Publish Chuncheon Mobility Map
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract website source
        run: |
          test -f chuncheon_webapp_deploy_source_v4.zip || { echo 'Upload chuncheon_webapp_deploy_source_v4.zip to the repository root'; exit 1; }
          unzip -oq chuncheon_webapp_deploy_source_v4.zip -d site
          cd site
          python3 scripts/prepare_data.py
          python3 scripts/collect_speed.py || true
      - name: Cache weekly published activity statistics
        id: activityweek
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - name: Restore last verified activity snapshot
        uses: actions/cache/restore@v4
        id: activitycache
        with:
          path: site/public/data/activity.json
          key: verified-chuncheon-activity-geocoded-v4-${{ steps.activityweek.outputs.week }}
          restore-keys: |
            verified-chuncheon-activity-geocoded-v4-
            verified-chuncheon-activity-geocoded-v2-
      - name: Rebuild verified activity data only if missing or out of date
        run: |
          cd site
          if [ "${{ steps.activitycache.outputs.cache-hit }}" != "true" ]; then
            if [ ! -s public/data/activity.json ]; then
              python3 ../scripts/collect_activity.py
            fi
            python3 ../scripts/geocode_activity.py
          fi
          python3 ../scripts/check_activity.py
      - name: Save verified weekly activity snapshot
        if: steps.activitycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site/public/data/activity.json
          key: verified-chuncheon-activity-geocoded-v4-${{ steps.activityweek.outputs.week }}
      - name: Bundle local map resources and improve rendering
        run: |
          bash patches/apply.sh
          node --check site/public/app.js
          node --check site/public/performance.js
          node --check site/public/activity.js
          node --check site/public/banner-routes.js
          node tests/tourism_map_smoke.cjs
          node tests/banner_routes_smoke.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
