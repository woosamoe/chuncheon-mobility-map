name: Publish Chuncheon Mobility Map
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract website source
        run: |
          test -f chuncheon_webapp_deploy_source.zip || { echo 'Upload chuncheon_webapp_deploy_source.zip to the repository root'; exit 1; }
          unzip -oq chuncheon_webapp_deploy_source.zip -d site
          cd site
          python3 scripts/prepare_data.py
          python3 scripts/collect_speed.py || true
      - name: Cache weekly published activity statistics
        id: activityweek
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: activitycache
        with:
          path: site/public/data/activity.json
          key: verified-chuncheon-activity-${{ steps.activityweek.outputs.week }}
      - name: Collect verified public mobility activity data
        if: steps.activitycache.outputs.cache-hit != 'true'
        run: |
          cd site
          python3 ../scripts/collect_activity.py
      - name: Bundle local map resources and improve rendering
        run: |
          bash patches/apply.sh
          node --check site/public/app.js
          node --check site/public/performance.js
          node --check site/public/activity.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
